<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertior de nota numérica a textual</title>
</head>
<body>
    <button onclick="funcion()">Introducir nota</button>
    <div id="resultado"></div>

    <script>
        function funcion() { 
            let resultado = "";
            let nota = prompt("Por favor, introduce la nota: ");

            // Comprobación de que la nota se ha introducido correctamente
            if (nota < 0 || nota > 10) {
                resultado = "ERROR: La nota introducida no es correcta.";
                document.getElementById("resultado").innerHTML = resultado;
                return;
            }

            // Guarda en resultado la nota textueal
            /*
            if (nota < 5) {
                resultado = "Insuficiente";
            } else if (nota >= 5 && nota < 6) {
                resultado = "Suficiente";
            } else if (nota >= 6 && nota < 7) {
                resultado = "Bien";
            } else if (nota >= 7 && nota < 8.5) {
                resultado = "Notable";
            } else if (nota >= 8.5 && nota < 10) {
                resultado = "Sobresaliente";
            } else //if (nota == 10) {
                resultado = "Matricula de honor";
            /*} else {
                resultado = "Esto jamas se ejecutará";   
            } */
            
            // No es necesario indicar los dos extremos del intérvalo si se sigue el orden
            if (nota < 5) {
                resultado = "Insuficiente";
            } else if (nota < 6) {
                resultado = "Suficiente";
            } else if (nota < 7) {
                resultado = "Bien";
            } else if (nota < 8.5) {
                resultado = "Notable";
            } else if (nota < 10) {
                resultado = "Sobresaliente";
            } else {
                resultado = "Matricula de honor";
            }

            document.getElementById("resultado").innerHTML = resultado;
        }
    </script>
</body>
</html>
